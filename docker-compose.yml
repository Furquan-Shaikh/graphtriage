services:
  mysql:
    image: mysql:8.0.35
    container_name: graphtriage-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-demo_root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-graphtriage}
      MYSQL_USER: ${MYSQL_USER:-graphtriage_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-demo_user_pass}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-demo_root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  neo4j:
    image: neo4j:5.20-community
    container_name: graphtriage-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/demo_neo4j_pass}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data

  graph-seed:
    image: furquanahmad/graphtriage-graph-seed:1.0
    container_name: graphtriage-graph-seed
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_started
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-graphtriage}
      MYSQL_USER: ${MYSQL_USER:-graphtriage_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-demo_user_pass}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-demo_neo4j_pass}

  inference-service:
    image: furquanahmad/graphtriage-inference:1.0
    container_name: graphtriage-inference-service
    restart: unless-stopped
    environment:
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-demo_neo4j_pass}
      GRAPHTRIAGE_DATA_DIR: /app/data/generated
    volumes:
      - ./data/generated:/app/data/generated:ro
    ports:
      - "${INFERENCE_PORT:-8000}:8000"
    depends_on:
      - neo4j
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  ticketing-service:
    image: furquanahmad/graphtriage-ticketing:1.1
    container_name: graphtriage-ticketing-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      inference-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-graphtriage}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-graphtriage_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-demo_user_pass}
      JWT_SECRET: ${JWT_SECRET:-demo_jwt_secret_for_local_use_only_0123456789_abcdef}
      DEMO_USER: ${DEMO_USER:-demo_user}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-ChangeMe123!}
      INFERENCE_SERVICE_URL: http://inference-service:8000
    ports:
      - "${SPRING_PORT:-8080}:8080"

volumes:
  mysql-data:
  neo4j-data: